schema_version = 1

[arena]
id = "runtime-test"
display_name = "Runtime Test"

[network]
cidr = "10.77.0.0/24"

[rules]
duration_seconds = 900
tick_ms = 1000
healthy_resources_per_tick = 1
minimum_territories = 2

[[classes]]
id = "test"
display_name = "Test"
[classes.resources]
vcpus = 1
memory_mib = 512
disk_mib = 1024

[[territories]]
id = "gate"
class = "test"
nixos_config = ".#gate"
[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ok"
[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60

[[territories]]
id = "archive"
class = "test"
nixos_config = ".#archive"
[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ok"
[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60

[[agents]]
id = "one"
territory = "gate"
adapter = "fake"
model = "fake/one"
[agents.budget]
resource_units = 10

[[agents]]
id = "two"
territory = "archive"
adapter = "fake"
model = "fake/two"
[agents.budget]
resource_units = 10
