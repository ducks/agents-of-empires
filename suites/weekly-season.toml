schema_version = 1

[season]
id = "infra-weekly"
display_name = "Infrastructure Weekly"

[rules]
# A seat whose result is unavailable (provider or harness failure) earns the
# heat one replay with the same draw; a repeat forfeits that seat.
unavailable_replays = 1
draw_replays = 1

# Fleet size is free. Heats are three seats because every arena declares
# three territories; byes and milestone-ranked wildcards fill the bracket.
[pool]
registry = "model-pool.json"
provider = "openrouter"

[[arenas]]
manifest = "../arenas/first-build/agents-real.toml"

[[arenas]]
manifest = "../arenas/durable-job-queue/agents-real.toml"

[[arenas]]
manifest = "../arenas/zero-downtime-rollout/agents-real.toml"

[[arenas]]
manifest = "../arenas/primary-failover/agents-real.toml"
