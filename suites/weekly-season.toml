schema_version = 1

[season]
id = "infra-weekly"
display_name = "Infrastructure Weekly"

[rules]
# A seat whose result is unavailable (provider or harness failure) earns the
# heat one replay with the same draw; a repeat forfeits that seat.
unavailable_replays = 1
draw_replays = 1

# Fleet size is free. Heats are three seats because every arena declares
# three territories; byes and milestone-ranked wildcards fill the bracket.
[[fleet]]
id = "deepseek"
model = "deepseek/deepseek-v4.1-flash"
adapter = "claux"
reasoning_effort = "high"

[[fleet]]
id = "luna"
model = "openai/gpt-5.6-luna"
adapter = "claux"
reasoning_effort = "high"

[[fleet]]
id = "glm"
model = "z-ai/glm-5.3"
adapter = "claux"
reasoning_effort = "high"

[[fleet]]
id = "kimi"
model = "moonshotai/kimi-k3"
adapter = "claux"
reasoning_effort = "high"

[[fleet]]
id = "qwen"
model = "qwen/qwen3.8-max-0902"
adapter = "claux"
reasoning_effort = "high"

[[fleet]]
id = "minimax"
model = "minimax/minimax-m3"
adapter = "claux"
reasoning_effort = "high"

# The arena pool. Each round draws one arena; the manifests' [[agents]] are
# templates whose budgets carry over to the drawn fleet.
[[arenas]]
manifest = "../arenas/first-build/agents-real.toml"

[[arenas]]
manifest = "../arenas/durable-job-queue/agents-real.toml"

[[arenas]]
manifest = "../arenas/zero-downtime-rollout/agents-real.toml"

[[arenas]]
manifest = "../arenas/primary-failover/agents-real.toml"
