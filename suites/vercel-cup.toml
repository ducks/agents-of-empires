schema_version = 1

[season]
id = "vercel-cup"
display_name = "Vercel Gateway Cup"

[rules]
unavailable_replays = 1
draw_replays = 1
memory_mib = 768

# Public catalog checked 2026-09-13: https://ai-gateway.vercel.sh/v1/models
# All entrants use Claux via Gateway; no Meta or xAI/SpaceXAI models.
# Catalog presence is not an account-access or live compatibility guarantee.
# default omits the effort request. Effort levels are not cross-model equal.
[[fleet]]
id = "deepseek"
model = "vercel/deepseek/deepseek-v4.1-flash"
adapter = "claux"
reasoning_effort = "default"

