schema_version = 1

[arena]
id = "hello-service"
display_name = "Hello Service"
mode = "build_race"

[network]
cidr = "10.88.0.0/24"
allow_public_internet = false

[rules]
duration_seconds = 600
tick_ms = 2000
healthy_resources_per_tick = 0
minimum_territories = 3

[build]
stop_on_first_durable = true
completion_milestone = "host-reboot"

[[build.milestones]]
id = "service-up"
display_name = "Service Up"
verifier = "verify/service-up.sh"
timeout_seconds = 5
points = 20

[[build.milestones]]
id = "service-restart"
display_name = "Service Restart"
depends_on = ["service-up"]
verifier = "verify/service-restart.sh"
timeout_seconds = 20
points = 30

[[build.milestones]]
id = "host-reboot"
display_name = "Host Reboot"
depends_on = ["service-restart"]
verifier = "verify/host-reboot.sh"
operation = "host_reboot"
timeout_seconds = 30
points = 50

[[classes]]
id = "builder"
display_name = "Builder"
[classes.resources]
vcpus = 1
memory_mib = 768
disk_mib = 2048

[[territories]]
id = "builder-one"
class = "builder"
nixos_config = ".#nixosConfigurations.builder-one.config.system.build.vm"
[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ready"
[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60

[[territories]]
id = "builder-two"
class = "builder"
nixos_config = ".#nixosConfigurations.builder-two.config.system.build.vm"
[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ready"
[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60

[[territories]]
id = "builder-three"
class = "builder"
nixos_config = ".#nixosConfigurations.builder-three.config.system.build.vm"
[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ready"
[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60

[[agents]]
id = "builder-one-agent"
territory = "builder-one"
adapter = "oracle"
model = "oracle"
[agents.budget]
resource_units = 1

[[agents]]
id = "builder-two-agent"
territory = "builder-two"
adapter = "oracle"
model = "oracle"
[agents.budget]
resource_units = 1

[[agents]]
id = "builder-three-agent"
territory = "builder-three"
adapter = "oracle"
model = "oracle"
[agents.budget]
resource_units = 1
