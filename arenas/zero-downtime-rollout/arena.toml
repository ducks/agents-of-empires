schema_version = 1

[arena]
id = "zero-downtime-rollout"
display_name = "Zero-Downtime Rollout"
mode = "build_race"

[network]
cidr = "10.80.0.0/24"
allow_public_internet = false

[rules]
duration_seconds = 900
tick_ms = 250
healthy_resources_per_tick = 0
minimum_territories = 3

[build]
stop_on_first_durable = true
completion_milestone = "host-reboot"

[[build.milestones]]
id = "baseline-ready"
display_name = "Live v1 Baseline"
verifier = "verify/baseline-ready.sh"
timeout_seconds = 5
points = 5

[[build.milestones]]
id = "uninterrupted-cutover"
display_name = "Uninterrupted v2 Cutover"
depends_on = ["baseline-ready"]
verifier = "verify/uninterrupted-cutover.sh"
timeout_seconds = 120
points = 45

[[build.milestones]]
id = "write-new"
display_name = "Write Through v2"
depends_on = ["uninterrupted-cutover"]
verifier = "verify/write-new.sh"
timeout_seconds = 10
points = 15

[[build.milestones]]
id = "v2-restart"
display_name = "v2 Service Restart"
depends_on = ["write-new"]
verifier = "verify/v2-restart.sh"
timeout_seconds = 20
points = 15

[[build.milestones]]
id = "host-reboot"
display_name = "Host Reboot"
depends_on = ["v2-restart"]
verifier = "verify/host-reboot.sh"
operation = "host_reboot"
timeout_seconds = 40
points = 20

[visualization]
[[visualization.nodes]]
id = "client"
display_name = "Client"
kind = "client"
x = 7
y = 24
[[visualization.nodes]]
id = "proxy"
display_name = "Live Proxy"
kind = "proxy"
milestone = "baseline-ready"
x = 31
y = 24
[[visualization.nodes]]
id = "v2"
display_name = "Version 2"
kind = "service"
milestone = "uninterrupted-cutover"
x = 58
y = 24
[[visualization.nodes]]
id = "state"
display_name = "State Store"
kind = "database"
milestone = "write-new"
x = 84
y = 24
[[visualization.nodes]]
id = "unit"
display_name = "v2 Unit"
kind = "service"
milestone = "v2-restart"
x = 42
y = 75
[[visualization.nodes]]
id = "host"
display_name = "NixOS Host"
kind = "host"
milestone = "host-reboot"
x = 75
y = 75
[[visualization.links]]
from = "client"
to = "proxy"
label = "HTTP"
[[visualization.links]]
from = "proxy"
to = "v2"
label = "cutover"
[[visualization.links]]
from = "v2"
to = "state"
kind = "storage"
[[visualization.links]]
from = "unit"
to = "v2"
kind = "lifecycle"
[[visualization.links]]
from = "host"
to = "unit"
kind = "lifecycle"

[[classes]]
id = "rollout-engineer"
display_name = "Rollout Engineer"

[classes.resources]
vcpus = 1
memory_mib = 768
disk_mib = 2048

[[territories]]
id = "rollout-one"
class = "rollout-engineer"
nixos_config = "./arenas/zero-downtime-rollout#nixosConfigurations.rollout-one.config.system.build.vm"

[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ready"

[territories.service.health]
poll_interval_ms = 250
consecutive_failures = 2
recovery_window_seconds = 30

[[territories]]
id = "rollout-two"
class = "rollout-engineer"
nixos_config = "./arenas/zero-downtime-rollout#nixosConfigurations.rollout-two.config.system.build.vm"

[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ready"

[territories.service.health]
poll_interval_ms = 250
consecutive_failures = 2
recovery_window_seconds = 30

[[territories]]
id = "rollout-three"
class = "rollout-engineer"
nixos_config = "./arenas/zero-downtime-rollout#nixosConfigurations.rollout-three.config.system.build.vm"

[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ready"

[territories.service.health]
poll_interval_ms = 250
consecutive_failures = 2
recovery_window_seconds = 30

[[agents]]
id = "rollout-one-agent"
territory = "rollout-one"
adapter = "oracle-rollout"
model = "oracle"

[agents.budget]
resource_units = 1

[[agents]]
id = "rollout-two-agent"
territory = "rollout-two"
adapter = "oracle-rollout"
model = "oracle"

[agents.budget]
resource_units = 1

