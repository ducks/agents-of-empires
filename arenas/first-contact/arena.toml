schema_version = 1

[arena]
id = "first-contact"
display_name = "First Contact"

[network]
cidr = "10.77.0.0/24"
allow_public_internet = false

[rules]
duration_seconds = 900
tick_ms = 1000
healthy_resources_per_tick = 1
minimum_territories = 3

[[classes]]
id = "gatekeeper"
display_name = "Gatekeeper"
strengths = ["network discovery", "HTTP routing", "traffic inspection"]
weaknesses = ["exposed route control", "small local state"]
[classes.resources]
vcpus = 1
memory_mib = 768
disk_mib = 2048

[[classes]]
id = "archivist"
display_name = "Archivist"
strengths = ["durable state", "SQL inspection", "transactional recovery"]
weaknesses = ["network database trust", "lock contention"]
[classes.resources]
vcpus = 1
memory_mib = 1024
disk_mib = 3072

[[classes]]
id = "courier"
display_name = "Courier"
strengths = ["fast coordination", "queue inspection", "volatile recovery"]
weaknesses = ["unauthenticated Redis", "ephemeral state"]
[classes.resources]
vcpus = 1
memory_mib = 768
disk_mib = 2048

[[territories]]
id = "gatekeeper"
class = "gatekeeper"
nixos_config = "./arenas/first-contact#nixosConfigurations.gatekeeper.config.system.build.vm"
[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "gatekeeper:ok"
[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60

[[territories]]
id = "archivist"
class = "archivist"
nixos_config = "./arenas/first-contact#nixosConfigurations.archivist.config.system.build.vm"
[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "archivist:ok"
[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60

[[territories]]
id = "courier"
class = "courier"
nixos_config = "./arenas/first-contact#nixosConfigurations.courier.config.system.build.vm"
[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "courier:ok"
[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60

[[agents]]
id = "gatekeeper-agent"
territory = "gatekeeper"
adapter = "claux"
model = "configured-at-runtime"
reasoning_effort = "high"
[agents.budget]
resource_units = 900

[[agents]]
id = "archivist-agent"
territory = "archivist"
adapter = "claux"
model = "configured-at-runtime"
reasoning_effort = "high"
[agents.budget]
resource_units = 900

[[agents]]
id = "courier-agent"
territory = "courier"
adapter = "claux"
model = "configured-at-runtime"
reasoning_effort = "high"
[agents.budget]
resource_units = 900
