[[classes]]
id = "surge-engineer"
display_name = "Surge Engineer"
[classes.resources]
vcpus = 1
memory_mib = 768
disk_mib = 2048
[[territories]]
id = "surge-one"
class = "surge-engineer"
nixos_config = ".#nixosConfigurations.surge-one.config.system.build.vm"
[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ready"
[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60
