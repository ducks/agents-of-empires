schema_version = 1
[arena]
id = "traffic-surge"
display_name = "Traffic Surge"
category = "traffic-and-saturation"
mode = "build_race"
[network]
cidr = "10.82.0.0/24"
allow_public_internet = false
[rules]
duration_seconds = 900
tick_ms = 2000
healthy_resources_per_tick = 0
minimum_territories = 3
[fog_of_war]
player_brief = "brief.md"
hide_topology_until_observed = true
[fog_of_war.guest_leak_audit]
scan_paths = ["/etc", "/opt", "/root", "/var/lib"]
forbidden_strings = ["priority-first-surge.sh", "bounded-optional.sh", "recover-peak.sh", "controller-owned load generator", "Traffic surge oracle"]
[build]
stop_on_first_durable = true
completion_milestone = "host-reboot"
[[build.milestones]]
id = "baseline-ready"
display_name = "Baseline Ready"
verifier = "verify/baseline-ready.sh"
timeout_seconds = 5
points = 5
[[build.milestones]]
id = "priority-first-surge"
display_name = "Priority Writes Under Surge"
depends_on = ["baseline-ready"]
verifier = "verify/priority-first-surge.sh"
timeout_seconds = 15
points = 20
[[build.milestones]]
id = "bounded-optional"
display_name = "Optional Load Bounded"
depends_on = ["priority-first-surge"]
verifier = "verify/bounded-optional.sh"
timeout_seconds = 15
points = 15
[[build.milestones]]
id = "recover-peak"
display_name = "Peak Writes Recoverable"
depends_on = ["bounded-optional"]
verifier = "verify/recover-peak.sh"
timeout_seconds = 20
points = 25
[[build.milestones]]
id = "restart-under-load"
display_name = "Restart Under Load"
depends_on = ["recover-peak"]
verifier = "verify/restart-under-load.sh"
timeout_seconds = 25
points = 15
[[build.milestones]]
id = "host-reboot"
display_name = "Host Reboot"
depends_on = ["restart-under-load"]
verifier = "verify/host-reboot.sh"
operation = "host_reboot"
timeout_seconds = 40
points = 20

[visualization]
[[visualization.nodes]]
id = "priority"
display_name = "Priority Traffic"
kind = "client"
x = 7
y = 22
[[visualization.nodes]]
id = "optional"
display_name = "Optional Surge"
kind = "client"
milestone = "bounded-optional"
x = 7
y = 76
[[visualization.nodes]]
id = "service"
display_name = "Surge Service"
kind = "service"
milestone = "baseline-ready"
x = 39
y = 48
[[visualization.nodes]]
id = "admission"
display_name = "Load Boundary"
kind = "proxy"
milestone = "priority-first-surge"
x = 66
y = 22
[[visualization.nodes]]
id = "ledger"
display_name = "Priority Ledger"
kind = "database"
milestone = "recover-peak"
x = 91
y = 48
[[visualization.nodes]]
id = "supervisor"
display_name = "Service Unit"
kind = "service"
milestone = "restart-under-load"
x = 65
y = 76
[[visualization.nodes]]
id = "host"
display_name = "NixOS Host"
kind = "host"
milestone = "host-reboot"
x = 91
y = 76
[[visualization.links]]
from = "priority"
to = "service"
label = "writes"
[[visualization.links]]
from = "optional"
to = "service"
label = "surge"
[[visualization.links]]
from = "service"
to = "admission"
label = "prioritize"
[[visualization.links]]
from = "admission"
to = "ledger"
