schema_version = 1
[arena]
id = "durable-job-queue"
display_name = "Durable Job Queue"
mode = "build_race"
[network]
cidr = "10.79.0.0/24"
allow_public_internet = false
[rules]
duration_seconds = 900
tick_ms = 2000
healthy_resources_per_tick = 0
minimum_territories = 3
[build]
stop_on_first_durable = true
completion_milestone = "host-reboot"
[[build.milestones]]
id = "service-up"
display_name = "API and Worker Up"
verifier = "verify/service-up.sh"
timeout_seconds = 5
points = 10
[[build.milestones]]
id = "recover-accepted"
display_name = "Recover Accepted Backlog"
depends_on = ["service-up"]
verifier = "verify/recover-accepted.sh"
timeout_seconds = 35
points = 25
[[build.milestones]]
id = "process-new"
display_name = "Process New Job"
depends_on = ["recover-accepted"]
verifier = "verify/process-new.sh"
timeout_seconds = 35
points = 20
[[build.milestones]]
id = "worker-restart"
display_name = "Worker Restart"
depends_on = ["process-new"]
verifier = "verify/worker-restart.sh"
timeout_seconds = 15
points = 20
[[build.milestones]]
id = "host-reboot"
display_name = "Host Reboot"
depends_on = ["worker-restart"]
verifier = "verify/host-reboot.sh"
operation = "host_reboot"
timeout_seconds = 30
points = 25
[[classes]]
id = "queue-builder"
display_name = "Queue Builder"
[classes.resources]
vcpus = 1
memory_mib = 768
disk_mib = 2048
[[territories]]
id = "queue-one"
class = "queue-builder"
nixos_config = "./arenas/durable-job-queue#nixosConfigurations.queue-one.config.system.build.vm"
[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ready"
[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60
[[territories]]
id = "queue-two"
class = "queue-builder"
nixos_config = "./arenas/durable-job-queue#nixosConfigurations.queue-two.config.system.build.vm"
[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ready"
[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60
[[territories]]
id = "queue-three"
class = "queue-builder"
nixos_config = "./arenas/durable-job-queue#nixosConfigurations.queue-three.config.system.build.vm"
[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ready"
[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60
[[agents]]
id = "queue-one-agent"
territory = "queue-one"
adapter = "oracle-queue"
model = "oracle"
[agents.budget]
resource_units = 1
[[agents]]
id = "queue-two-agent"
territory = "queue-two"
adapter = "oracle-queue"
model = "oracle"
[agents.budget]
resource_units = 1
[[agents]]
id = "queue-three-agent"
territory = "queue-three"
adapter = "oracle-queue"
model = "oracle"
[agents.budget]
resource_units = 1
