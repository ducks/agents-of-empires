[[classes]]
id = "queue-builder"
display_name = "Queue Builder"
[classes.resources]
vcpus = 1
memory_mib = 768
disk_mib = 2048
[[territories]]
id = "queue-one"
class = "queue-builder"
nixos_config = ".#nixosConfigurations.queue-one.config.system.build.vm"
[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ready"
[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60
