schema_version = 1
[arena]
id = "durable-job-queue"
display_name = "Durable Job Queue"
category = "stateful-recovery"
mode = "build_race"
[network]
cidr = "10.79.0.0/24"
allow_public_internet = false
[rules]
duration_seconds = 900
tick_ms = 2000
healthy_resources_per_tick = 0
minimum_territories = 3
[fog_of_war]
player_brief = "brief.md"
hide_topology_until_observed = true
[fog_of_war.guest_leak_audit]
scan_paths = ["/etc", "/opt", "/root", "/var/lib"]
forbidden_strings = ["recover-accepted.sh", "process-new.sh", "controller-owned referee evidence", "Durable job queue contract"]
[build]
stop_on_first_durable = true
completion_milestone = "host-reboot"
[[build.milestones]]
id = "service-up"
display_name = "API and Worker Up"
verifier = "verify/service-up.sh"
timeout_seconds = 5
points = 10
[[build.milestones]]
id = "recover-accepted"
display_name = "Recover Accepted Backlog"
depends_on = ["service-up"]
verifier = "verify/recover-accepted.sh"
timeout_seconds = 35
points = 25
[[build.milestones]]
id = "process-new"
display_name = "Process New Job"
depends_on = ["recover-accepted"]
verifier = "verify/process-new.sh"
timeout_seconds = 35
points = 20
[[build.milestones]]
id = "worker-restart"
display_name = "Worker Restart"
depends_on = ["process-new"]
verifier = "verify/worker-restart.sh"
timeout_seconds = 15
points = 20
[[build.milestones]]
id = "host-reboot"
display_name = "Host Reboot"
depends_on = ["worker-restart"]
verifier = "verify/host-reboot.sh"
operation = "host_reboot"
timeout_seconds = 30
points = 25

[visualization]
[[visualization.nodes]]
id = "client"
display_name = "Client"
kind = "client"
x = 7
y = 25
[[visualization.nodes]]
id = "api"
