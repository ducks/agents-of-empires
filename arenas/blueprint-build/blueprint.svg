    <text x="105" y="758" fill="#fff" font-size="21">GET  /jobs/&lt;opaque-id&gt;</text><text x="390" y="758" fill="#9ba9a7" font-size="21">→ 409 pending  ·  then 200 exact original bytes</text>
    <text x="105" y="798" fill="#f4c86b" font-size="18">Acceptance must continue while the worker is stopped. Queued and completed work must survive restarts and reboot.</text>
