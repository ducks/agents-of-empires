schema_version = 1

[arena]
id = "blueprint-build"
display_name = "Blueprint Build"
category = "architecture-implementation"
mode = "build_race"

[network]
cidr = "10.84.0.0/24"
allow_public_internet = false

[rules]
duration_seconds = 900
tick_ms = 2000
healthy_resources_per_tick = 0
minimum_territories = 3

[fog_of_war]
player_brief = "brief.md"
player_artifacts = ["blueprint.png"]
hide_topology_until_observed = true

[fog_of_war.guest_leak_audit]
scan_paths = ["/etc", "/opt", "/root", "/var/lib"]
forbidden_strings = ["accept-under-stop.sh", "recover-blueprint.sh", "controller-owned blueprint evidence", "blueprint oracle"]

[build]
stop_on_first_durable = true
completion_milestone = "host-reboot"

[[build.milestones]]
id = "gateway-ready"
display_name = "Gateway Ready"
verifier = "verify/gateway-ready.sh"
timeout_seconds = 8
points = 10

[[build.milestones]]
id = "accept-under-stop"
display_name = "Accept While Worker Stopped"
depends_on = ["gateway-ready"]
verifier = "verify/accept-under-stop.sh"
timeout_seconds = 20
points = 20

[[build.milestones]]
id = "recover-blueprint"
display_name = "Recover Queued Work"
depends_on = ["accept-under-stop"]
verifier = "verify/recover-blueprint.sh"
timeout_seconds = 35
points = 25

[[build.milestones]]
id = "service-restart"
display_name = "Independent Service Restart"
depends_on = ["recover-blueprint"]
verifier = "verify/service-restart.sh"
timeout_seconds = 25
points = 20

[[build.milestones]]
id = "host-reboot"
display_name = "Host Reboot"
depends_on = ["service-restart"]
verifier = "verify/host-reboot.sh"
operation = "host_reboot"
timeout_seconds = 40
points = 25

[visualization]

[[visualization.nodes]]
id = "client"
display_name = "Client"
kind = "client"
x = 5
y = 28

[[visualization.nodes]]
id = "edge"
display_name = "Edge Gateway"
kind = "proxy"
milestone = "gateway-ready"
x = 23
y = 28

[[visualization.nodes]]
id = "api"
display_name = "API Receiver"
kind = "service"
milestone = "accept-under-stop"
x = 42
y = 28

[[visualization.nodes]]
id = "queue"
display_name = "Durable Queue"
kind = "queue"
milestone = "recover-blueprint"
x = 61
y = 28

[[visualization.nodes]]
id = "worker"
display_name = "Worker"
kind = "worker"
milestone = "recover-blueprint"
x = 80
y = 28

[[visualization.nodes]]
id = "results"
display_name = "Result Store"
kind = "storage"
milestone = "service-restart"
x = 80
y = 72

[[visualization.nodes]]
id = "host"
display_name = "NixOS Host"
kind = "host"
milestone = "host-reboot"
x = 42
y = 72

[[visualization.links]]
from = "client"
to = "edge"
label = "HTTP :8080"

[[visualization.links]]
from = "edge"
to = "api"
label = "route"

[[visualization.links]]
from = "api"
to = "queue"
kind = "queue"
label = "accept"

[[visualization.links]]
from = "queue"
to = "worker"
kind = "queue"
label = "claim"

[[visualization.links]]
from = "worker"
to = "results"
kind = "storage"
label = "complete"

[[visualization.links]]
from = "results"
to = "api"
kind = "storage"
label = "read"

[[visualization.links]]
from = "host"
to = "edge"
kind = "lifecycle"

[[classes]]
id = "blueprint-builder"
display_name = "Blueprint Builder"

[classes.resources]
vcpus = 1
memory_mib = 768
disk_mib = 2048

[[territories]]
id = "blueprint-one"
class = "blueprint-builder"
nixos_config = ".#nixosConfigurations.blueprint-one.config.system.build.vm"

[territories.service]
port = 8080
path = "/health"
expected_status = 200
expected_body = "ready"

[territories.service.health]
poll_interval_ms = 1000
consecutive_failures = 3
recovery_window_seconds = 60

